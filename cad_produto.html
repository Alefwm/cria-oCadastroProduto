<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro produto</title>
    <link rel="stylesheet" href="cad_produto.css">
</head>
<body>
       <!-- Base do site de configuração de caixa de uma logística -->
    <header class="topo">
        <h1 class="logo">Baraty<span>Pacotes</span></h1>

        <nav class="menu">
            <ul>
                <li><a href="inde.html" >Home</a></li>
                <li><a href="cad_produto.html" class="ativo">Cadastro do produto</a></li>
                <li><a href="remocao.html">Remoção do produto</a></li>
                <li><a href="cadastrados.html">Cadastrados</a></li>
                <li><a href="niveis.html">Níveis atuais</a></li>
            </ul>
        </nav>
    </header>

<!-- usabilidae do java script ------------------>

<main class="pagina">
    <div class="container">
        <h1>Cadastro de produtos</h1>
        <p class="subtitulo">Preencha os dados da mercadoria que chegou ao estoque.</p>

        <div class="campos">
            <div class="campo campo--cheio">
                <label for="nomeProduto">Nome do produto</label>
                <input id="nomeProduto" type="text" placeholder="Ex.: Caixa de papelão 40x30">
            </div>

            <div class="campo">
                <label for="nomeDaEmpresa">Nome da empresa</label>
                <input id="nomeDaEmpresa" type="text" placeholder="Ex.: Transportes Alfa">
            </div>

            <div class="campo">
                <label for="codigoProduto">Código do produto</label>
                <input id="codigoProduto" type="text" placeholder="Ex.: BP-00123">
            </div>

            <div class="campo">
                <label for="dataProduto">Data de entrada</label>
                <input id="dataProduto" type="date">
            </div>

            <div class="campo">
                <label for="pesoProduto">Peso do pacote</label>
                <div class="input-unidade">
                    <input id="pesoProduto" type="number" min="0.01" step="0.01" placeholder="0,00">
                    <span>kg</span>
                </div>
            </div>
        </div>

        <button id="buttonEntradaProduto" class="btn-cadastro" type="button">
            Cadastrar produto
            <span class="btn-seta" aria-hidden="true">→</span>
        </button>

        <p id="cadastroConcluido" class="msg" role="status" aria-live="polite"></p>
    </div>
</main>

<script src="cad_produto.js" ></script>
</body>
</html>
